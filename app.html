<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tells the EyeScore extension not to restyle this page (it would interfere with the tests). -->
  <meta name="eyescore-site" content="1">
  <title>EyeScore test: find your screen settings</title>
  <meta name="description" content="Three short screen tests find your limits on this screen. Published rules turn them into text size, contrast and color settings. Not an eye exam.">
  <link rel="icon" type="image/png" href="img/icon-32.png">
  <link rel="preload" href="fonts/urbanist-latin-wght.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="index.html" id="brand-home" aria-label="EyeScore home">
        <img src="img/icon-180.png" alt="" width="28" height="28">
        <span>EyeScore</span>
      </a>
      <div class="progress" id="progress" hidden>
        <div class="progress-label" id="progress-label"></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="ext-pill" id="ext-pill" hidden>Extension connected</div>

    <a href="privacy.html">Privacy</a>
